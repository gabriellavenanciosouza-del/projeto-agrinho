<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriNho Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🌱 AgriNho Chat</h1>
        <p>Digite sua pergunta e receba dicas sobre agricultura!</p>
    </header>

    <main>
        <div id="chat-container">
            <div id="chat-messages"></div>
        </div>

        <input type="text" id="userInput" placeholder="Escreva algo sobre agricultura...">
        <button id="sendBtn">Enviar</button>
    </main>

    <footer>
        <p>Feito com ❤️ para os agricultores</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
